<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, description, canonical, Open Graph, Twitter and JSON-LD are emitted
      per route by src/components/Seo.tsx and baked into each prerendered page at
      build time. They are deliberately absent here: a static canonical in this
      template is served on every URL, which tells crawlers the whole site is a
      duplicate of the homepage.
    -->

    <link rel="icon" type="image/png" href="/genz-ai-logo.png" />
    <link rel="apple-touch-icon" href="/genz-ai-logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
